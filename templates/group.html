{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>按分类统计数量</h2>
    <table>
        <tr><th>分类</th><th>数量</th></tr>
        {% for row in data %}
        <tr><td>{{row.category}}</td><td>{{row.count}}</td></tr>
        {% endfor %}
    </table>
    <p><a href="/">返回首页</a></p>
</div>
{% endblock %}
