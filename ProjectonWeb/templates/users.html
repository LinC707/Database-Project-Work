{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>用户列表</h2>
    <table>
        <tr><th>ID</th><th>姓名</th><th>电话</th></tr>
        {% for u in users %}
        <tr>
            <td>{{u.user_id}}</td>
            <td>{{u.user_name}}</td>
            <td>{{u.phone}}</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="/">返回首页</a></p>
</div>
{% endblock %}
