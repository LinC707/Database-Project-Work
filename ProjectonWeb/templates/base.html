<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "校园二手交易平台" }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f7f8fb; color: #222; }
        h1, h2, h3 { margin: 0 0 12px; }
        .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .col { flex: 1 1 320px; min-width: 280px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #e4e7ec; padding: 8px 10px; text-align: left; }
        th { background: #f3f5f8; }
        .nav a { margin-right: 10px; text-decoration: none; color: #1f5eff; }
        .nav a:hover { text-decoration: underline; }
        .muted { color: #666; }
        .status-sold { color: #c0392b; font-weight: bold; }
        .status-unsold { color: #2e7d32; font-weight: bold; }
        .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
        .msg.success { background: #ecfdf3; color: #12703d; border: 1px solid #b7ebc6; }
        .msg.error { background: #fff1f1; color: #a12222; border: 1px solid #f1c6c6; }
        form.inline > * { margin-right: 8px; margin-bottom: 8px; }
        input, select, button { padding: 6px 8px; border: 1px solid #ccd2da; border-radius: 6px; }
        button { background: #1f5eff; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #194cd0; }
    </style>
</head>
<body>
    <h1>校园二手交易平台</h1>
    <p class="muted">Flask + MySQL 数据库课程项目</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
